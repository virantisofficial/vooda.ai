# Dependabot: security updates arrive as auto-PRs instead of accumulating
# as alerts. Weekly cadence, grouped per ecosystem so routine bumps land
# as one reviewable PR rather than twenty.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
