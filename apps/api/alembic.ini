[alembic]
script_location = apps/api/alembic
# This URL is only a fallback — env.py reads `DATABASE_URL_SYNC`
# from the environment first. The fallback uses the docker service
# name `db` (not `localhost`) so a developer who runs alembic from
# inside a container without setting the env still gets a working
# connection on the standard compose network. For local dev outside
# docker, set `DATABASE_URL_SYNC` in your shell.
sqlalchemy.url = postgresql://vooda:vooda_dev_password@db:5432/vooda

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
